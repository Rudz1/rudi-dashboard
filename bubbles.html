<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#ffffff">
<title>Rudi &middot; bubbles</title>
<style>
:root{--or:#ff7a00;--or2:#ffa04a;--ink:#1f2937;--dim:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;cursor:grab;background:radial-gradient(ellipse at 50% 45%,#fff 0%,#fff 55%,#fff7ef 100%)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#threads{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#threads path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
#threads circle{pointer-events:none}
/* ambient decorative bubbles (screen space) */
#amb{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#amb i{position:absolute;bottom:-60px;border-radius:50%;border:1.5px solid rgba(255,138,31,.16);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.9),rgba(255,160,74,.06) 60%,rgba(255,160,74,.03));animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.8);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate3d(var(--dx),-115vh,0) scale(1.1);opacity:0}}
/* chief */
.chief{position:absolute;left:-105px;top:-105px;width:210px;height:210px;z-index:6;cursor:pointer}
.chief::before{content:"";position:absolute;inset:-46px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,31,.34),rgba(255,138,31,0) 68%);animation:glow 4.2s ease-in-out infinite;pointer-events:none}
.rip{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,138,31,.45);animation:rip 5s ease-out infinite;pointer-events:none}
.rip.b{animation-delay:2.5s}
@keyframes rip{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
@keyframes glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.035)}}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 24%,#ffd29c 0%,#ffa23d 34%,#ff7a00 70%,#e56000 100%);box-shadow:0 20px 50px rgba(255,122,0,.35),inset -16px -20px 36px rgba(190,70,0,.33),inset 12px 14px 26px rgba(255,255,255,.38);animation:breathe 4.2s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding-top:6px}
.orb::after{content:"";position:absolute;left:17%;top:9%;width:34%;height:19%;border-radius:50%;background:rgba(255,255,255,.4);transform:rotate(-24deg);filter:blur(2px)}
.face{width:92px;height:56px;display:block;margin-bottom:6px}
.eye{transform-box:fill-box;transform-origin:center;animation:none}
.blink .eye{animation:blink .17s ease-in-out}
@keyframes blink{50%{transform:scaleY(.08)}}
.hello{font-size:15px;font-weight:800;line-height:1.1;text-shadow:0 1px 2px rgba(150,60,0,.35)}
.when{font-size:11px;font-weight:600;opacity:.95;margin-top:3px;line-height:1.2;text-shadow:0 1px 2px rgba(150,60,0,.3)}
/* satellite / card */
.frame{position:absolute;left:0;top:0;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle at 30% 22%,var(--c2),var(--c) 64%,var(--c3));box-shadow:0 0 0 2px var(--c),0 12px 28px var(--cg),inset 0 -8px 16px rgba(0,0,0,.08);color:var(--ink2);opacity:0;will-change:transform}
.frame.open{cursor:default;box-shadow:0 0 0 2px var(--c),0 16px 40px var(--cg)}
.bub{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px 0 0 -50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;pointer-events:none}
.bub svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bub b{font-size:12.5px;font-weight:800;letter-spacing:.01em;line-height:1.05;max-width:90px}
.bub small{font-size:10.5px;font-weight:700;opacity:.92;line-height:1}
.bub::before{content:"";position:absolute;left:19%;top:11%;width:34%;height:19%;border-radius:50%;background:rgba(255,255,255,.42);transform:rotate(-26deg);filter:blur(1.5px)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;display:flex;flex-direction:column;opacity:0;color:var(--ink)}
.hd{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(135deg,var(--c2),var(--c));color:var(--ink2);cursor:grab}.frame.dragging .hd{cursor:grabbing}.frame.dragging{box-shadow:0 0 0 2px var(--c),0 24px 50px var(--cg)}
.hd svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd .tt{flex:1;min-width:0;line-height:1.1}
.hd .tt b{display:block;font-size:16px;font-weight:800}
.hd .tt small{font-size:10px;opacity:.88;font-weight:600}
.hd .tt small.stale{font-weight:800;opacity:1;text-decoration:underline}
.hd .x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;font-weight:700;cursor:pointer;flex:none;transition:background .15s,transform .15s}.hd .x:hover{background:rgba(255,255,255,.5);transform:scale(1.12)}
.bd{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 14px 14px;font-size:13px;line-height:1.3;touch-action:none;scrollbar-width:thin;scrollbar-color:#ddd transparent;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.bd.scroll{touch-action:pan-y}
.hero{font-size:28px;font-weight:800;line-height:1.05;color:var(--c)}
.herosub{font-size:12px;color:var(--dim);margin:2px 0 6px}
.bigrow{margin-bottom:8px}.bigrow .hero{font-size:23px}
.row{padding:7px 0;border-top:1px solid #f0f0f4}
.row:first-child{border-top:0}
.row .t{font-weight:700}
.row .d{color:var(--dim);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row .s{font-size:11px;font-weight:800;margin-left:6px;color:#16a34a}
.row.bad .s,.row.bad .t{color:#e11d48}
.row.amb .s{color:#d97706}
.ph{font-size:11px;color:var(--dim);padding-top:6px}
.empty{color:var(--dim);padding:6px 0}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #f0f0f4}
.vrow:first-child{border-top:0}
.vrow .vn{font-weight:700;font-size:12.5px;line-height:1.15;min-width:0}
.vrow .vn small{display:inline;margin-left:6px;color:var(--dim);font-weight:600;font-size:11.5px}
.vrow .vn small.late{color:#e11d48;font-weight:800}
.vcs{display:flex;gap:4px;flex:none;font-weight:800}
.vc{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:1.5px solid #d1d5db;color:#9ca3af}
.vc.on{background:#22c55e;border-color:#22c55e;color:#fff}
.dg{padding:5px 0;border-top:1px solid #f0f0f4}
.dg:first-child{border-top:0}
.dh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.dh b{font-size:15px;color:var(--ink);margin:0 3px}
.dg.today .dh,.dg.today .dh b{color:var(--or)}
.ev{font-size:12.5px;line-height:1.2;margin:4px 0;padding-left:8px;border-left:4px solid var(--k);font-weight:600;overflow-wrap:anywhere}
.ev i{font-style:normal;color:#c2410c;font-weight:800;margin-right:5px}
.ev.t{font-style:italic;opacity:.85}
.more{font-size:11px;color:#9ca3af;padding:2px 0}
.coming{margin-top:8px;padding-top:8px;border-top:2px dashed #e5e7eb}
.coming .ch{font-size:11px;font-weight:800;color:#16a34a;letter-spacing:.06em;margin-bottom:3px}
.coming div.lt{font-size:12px;margin:3px 0;padding-left:8px;border-left:4px solid var(--k)}
.coming b{margin-right:5px}
/* to-do (tickable list) */
.tdl .td{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid #f0f0f4;cursor:pointer;font-size:13.5px;line-height:1.2;font-weight:700;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tdl .td:first-child{border-top:0}
.td input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.td .cb{flex:none;width:20px;height:20px;border:2px solid #b6bcc8;border-radius:6px;margin-top:0;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,transform .15s}
.td:active .cb{transform:scale(.88)}
.td input:checked+.cb{background:#22c55e;border-color:#22c55e}
.td input:checked+.cb::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.td input:focus-visible+.cb{outline:2px solid var(--c);outline-offset:2px}
.td .tx{min-width:0;overflow-wrap:anywhere;transition:opacity .2s}
.td.on .tx{text-decoration:line-through;opacity:.42}
.td.lk{cursor:default}
.td .tx small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:2px}
.td .tx small.od{color:#e11d48;font-weight:800}
/* controls */
.ctl{position:fixed;z-index:30;display:flex;gap:8px;padding:0}
#zc{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column}
#tr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
.btn{width:40px;height:40px;border-radius:50%;border:1.5px solid #ffd9b3;background:rgba(255,255,255,.92);color:#e56000;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(255,122,0,.15);touch-action:manipulation;transition:transform .15s,background .15s;font-family:inherit;line-height:1}
.btn:hover{transform:scale(1.1)}.btn:active{transform:scale(.92);background:#fff0e0}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill{height:34px;width:auto;padding:0 14px;border-radius:17px;font-size:12px}
#fsb{display:none}
#live{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:#9a6a3a;background:rgba(255,255,255,.92);border:1.5px solid #ffe3c7;border-radius:15px;padding:6px 11px;pointer-events:none}
#live i{width:8px;height:8px;border-radius:50%;background:#bbb}
#live.on i{background:#22c55e;animation:pulse 2s infinite}
#live.warn i{background:#f59e0b}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.dot{position:absolute;border-radius:50%;pointer-events:none}
/* gate */
#gate{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;text-align:center;padding:1.2rem;overflow:hidden}
.gorb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 32% 24%,#ffd29c 0%,#ffa23d 34%,#ff7a00 70%,#e56000 100%);box-shadow:0 14px 36px rgba(255,122,0,.35),inset -8px -10px 20px rgba(190,70,0,.3),inset 7px 8px 16px rgba(255,255,255,.4);animation:breathe 4.2s ease-in-out infinite;position:relative}
.gorb::after{content:"";position:absolute;left:17%;top:10%;width:34%;height:19%;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(-24deg)}
#gate h1{font-size:28px;font-weight:800;color:#e56000;letter-spacing:.02em}
#gate form{display:flex;flex-direction:column;align-items:center;gap:16px}
#pw{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#dots{display:flex;gap:12px;height:18px;align-items:center}
#dots i{width:14px;height:14px;border-radius:50%;border:2px solid #ffc58a;background:transparent;transition:all .15s}
#dots i.f{background:var(--or);border-color:var(--or);transform:scale(1.15)}
#pad{display:grid;grid-template-columns:repeat(3,4.6rem);gap:12px}
#pad button{height:4.6rem;border-radius:50%;border:0;background:#fff3e6;color:#c2500a;font-size:1.9rem;font-weight:800;cursor:pointer;touch-action:manipulation;font-family:inherit;transition:transform .12s,background .12s}
#pad button:active{transform:scale(.9);background:#ffd9b3}
#pad button.go{background:var(--or);color:#fff;box-shadow:0 6px 18px rgba(255,122,0,.35)}
#pad button.alt{background:#f3f4f6;color:#6b7280}
#gate .err{color:#e11d48;font-size:14px;min-height:1.3rem;font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:shake .4s}
@media (max-height:640px){#pad{grid-template-columns:repeat(3,3.6rem);gap:8px}#pad button{height:3.6rem;font-size:1.5rem}.gorb{width:64px;height:64px}#gate{gap:8px}}
@media (prefers-reduced-motion:reduce){#amb i,.rip,.chief::before{animation:none}.orb{animation:none}}
</style>
</head>

<div id="gate"><div class="gorb"></div><h1>Rudi</h1><form id="f" autocomplete="off"><input id="pw" type="password" readonly inputmode="none" autocomplete="off" aria-label="Passcode" tabindex="-1"><div id="dots"></div><div id="pad"><button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" data-k="del" class="alt" aria-label="Delete">&#9003;</button><button type="button" data-k="0">0</button><button type="submit" id="signin" class="go" aria-label="Unlock">&#10003;</button></div></form><div class="err" id="err"></div></div>
<div id="app" style="display:none">
 <div id="stage"><div id="amb"></div><div id="world"><svg id="threads"></svg>
  <div class="chief" id="chief"><div class="rip"></div><div class="rip b"></div><div class="orb"><svg class="face" viewBox="0 0 96 58"><rect x="2" y="2" width="92" height="54" rx="27" fill="#fff" opacity=".96"/><g id="eyes"><ellipse class="eye" cx="34" cy="25" rx="5.8" ry="8" fill="#9a3d00"/><ellipse class="eye" cx="62" cy="25" rx="5.8" ry="8" fill="#9a3d00"/></g><path id="mouth" d="M39 41q9 7 18 0" stroke="#e56000" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg><div class="hello" id="hello">Hello, Rudi</div><div class="when" id="when"></div></div></div>
 </div></div>
 <div class="ctl" id="tr"><button class="btn pill" id="lock">Lock</button></div>
 <div class="ctl" id="zc"><button class="btn" id="fsb" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">&minus;</button><button class="btn" id="fit" aria-label="Fit all"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button></div>
 <div id="live"><i></i><span id="livet">&hellip;</span></div>
</div>

function pdate(d,t){ if(!d) return null; const m=String(d).match(/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d):(\d\d))?/); if(!m) return null; let h=m[4],mi=m[5]; if(!h&&t){const x=String(t).match(/^(\d{1,2}):(\d\d)/); if(x){h=x[1];mi=x[2];}} return {d:new Date(+m[1],+m[2]-1,+m[3],+(h||0),+(mi||0)), t:!!h}; }

function dayKey(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
function fmtD(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"");}
function hm(d){return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function g(r,i){return (r&&r[i]!=null)?String(r[i]):"";}
function parseTab(name){
  const rows=(RAW&&RAW[name])||[];
  const meta={title:g(rows[0],0),updated:g(rows[1],1),owner:g(rows[1],3),r3:rows[2]||[]};
  const items=[];
  let st=4; if(name==="Finances"){const hi=rows.findIndex((r,i)=>i>=3&&g(r,0).trim()==="Item"&&g(r,1).trim()==="Status"); if(hi>=0) st=hi+1;}
  rows.slice(st).forEach(r=>{ if(!g(r,0).trim()) return;
    if(name==="Calendar") items.push({date:g(r,0),time:g(r,1),item:g(r,2),cat:g(r,3),owner:g(r,4),detail:g(r,5)});
    else items.push({item:g(r,0),status:g(r,1),date:g(r,2),detail:g(r,3),updated:g(r,4)}); });
  return {meta,items};
}

function cls(it){const s=((it.status||"")+" "+it.item).toUpperCase(); if(/WARNING|ERROR|NEEDS|ACTION|DEADLINE/.test(s)) return "bad"; if(/TENTATIVE|PENCILLED|TBC|PLANNED - NOT/.test(s)) return "amb"; return "";}

function money(v){const n=parseFloat(String(v).replace(/[^\d.-]/g,"")); if(isNaN(n)) return null; return (n<0?"-":"")+"\u00a3"+Math.abs(n).toLocaleString("en-GB",{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2});}

function vidPost(t){const rows=(RAW["Video & Projects"]||[]).slice(4).filter(r=>g(r,0).trim()&&isWedRow(r));if(!rows.length)return "";const today=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());let h='';rows.forEach(r=>{const nm=g(r,0).trim();const d=vdate(nm);const base=nm.replace(/\s*\([^)]*\)\s*$/,"");const dn=[1,2,3,4,5].map(i=>vclean(g(r,i))===VD[i-1]);const late=d&&d<today&&dn.some(x=>!x);h+='<div class="vrow"><div class="vn">'+esc(base)+(d?'<small class="'+(late?"late":"")+'">'+fmtD(d)+""+'</small>':"")+'</div><div class="vcs">'+dn.map((x,i)=>'<span class="vc'+(x?" on":"")+'" title="'+["Movie","Ceremony","Speeches","First dance","Trailer"][i]+'">'+VL[i]+'</span>').join("")+'</div></div>';});return h;}
function finPost(t){const rows=(RAW.Finances||[]).slice(3);const today=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());const mo=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];const days=[];rows.forEach(r=>{const m=g(r,0).trim().match(/^[A-Za-z]{3}\s+(\d{1,2})\s+([A-Za-z]{3})$/);if(!m)return;const mi=mo.indexOf(m[2].toLowerCase());if(mi<0)return;let d=new Date(today.getFullYear(),mi,+m[1]);if(d<new Date(today.getFullYear(),today.getMonth()-6,1))d=new Date(today.getFullYear()+1,mi,+m[1]);if(d<today)return;const out=g(r,1).split("\n");days.push({d,day:g(r,0).trim(),amt:out[0].trim(),lab:(out[1]||"").trim(),left:g(r,2).trim()});});if(!days.length)return "";const nx=days;let h='';nx.forEach(x=>{const neg=/^-|\u2212/.test(x.left);h+='<div class="vrow"><div class="vn">'+esc(x.day)+(x.amt?'<small>'+esc(x.amt)+(x.lab?" \u00b7 "+esc(x.lab.length>24?x.lab.slice(0,22)+"\u2026":x.lab):"")+'</small>':'')+'</div><div class="vcs"><b'+(neg?' style="color:#ff6b6b"':'')+'>'+esc(x.left)+'</b></div></div>';});return h;}

 for(let i=0;i<14;i++){
  const d=document.createElement("div"); d.className="dot"; const s=5+Math.random()*7; d.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${i%3?col:"#ffb347"};z-index:40`;
  world.appendChild(d); const a=Math.random()*6.283, r=70+Math.random()*80;
  const an=d.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(.2)`,opacity:0}],{duration:600+Math.random()*350,easing:"cubic-bezier(.15,.8,.3,1)"});
  an.onfinish=()=>d.remove();
 }
}
function openNode(n){
 if(n.open) return; layoutCard(n);
 n.open=true; let pos=null;
 if(n.memo){const m=n.memo; const hit=NODES.some(o=>o!==n&&o.open&&Math.abs(m.x-o.ox)<(n.ow+o.ow)/2+GAP_PAD&&Math.abs(m.y-o.oy)<(n.oh+o.oh)/2+GAP_PAD); if(!hit){pos=m;n.dragged=true;}}
 if(!pos){pos=place(n);n.dragged=false;} n.ox=pos.x; n.oy=pos.y;
 n.px.k=95;n.px.c=8.5;n.py.k=95;n.py.c=8.5; n.pw.k=120;n.pw.c=10;n.phh.k=120;n.phh.c=10;n.p.k=110;n.p.c=9;
 n.px.t=n.ox; n.py.t=n.oy; n.pw.t=n.ow; n.phh.t=n.oh; n.p.t=1;
 n.sq.v=-7; const l=Math.hypot(n.ox,n.oy)||1; n.px.v+=n.ox/l*420; n.py.v+=n.oy/l*420;
 n.el.style.zIndex=10+(++zc); n.el.classList.add("open"); n.lastZ=zc; burst(n.px.x,n.py.x,n.c); refit();
}
function closeNode(n){
 if(!n.open) return; n.open=false; n.memo=n.dragged?{x:n.ox,y:n.oy}:null; n.dragged=false; if(dragNode===n){dragNode=null;dragging=false;} n.el.classList.remove("dragging");
 n.px.k=70;n.px.c=8;n.py.k=70;n.py.c=8;n.pw.k=140;n.pw.c=12;n.phh.k=140;n.phh.c=12;n.p.k=130;n.p.c=12;
 n.p.t=0; n.pw.t=S; n.phh.t=S; n.sq.v=5; n.el.classList.remove("open"); refit();
}
function toggleNode(n){ n.open?closeNode(n):openNode(n); }
/* ---------- frame loop ---------- */
let eyeX=0,eyeY=0, dragNode=null, dragging=false, dragOff=null;
function step(dt){
 const sub=2, h=dt/sub;
 NODES.forEach(n=>{
  if(!n.alive){ if(nowS>=n.born){ n.alive=true; n.el.style.opacity=1; n.pw.x=S*.3; n.phh.x=S*.3; n.sq.v=-4; } else return; }
  // targets
  if(!n.open){
   const t=nowS, rr=1+Math.sin(t*0.4+n.ph)*0.04;
   let tx=n.hx*rr+Math.sin(t*0.7+n.ph)*7+Math.sin(t*0.31+n.ph*2)*5, ty=n.hy*rr+Math.cos(t*0.9+n.ph*1.3)*8+Math.sin(t*0.5+n.ph)*3;
   n.hv.t=0;
   if(ptrW){const vx=ptrW.x-n.px.x,vy=ptrW.y-n.py.x,d=Math.hypot(vx,vy);
    if(d<280&&d>1){const pull=(1-d/280)*20; tx+=vx/d*pull; ty+=vy/d*pull;}
    if(d<S/2+6) n.hv.t=0.14;}
   n.px.t=tx; n.py.t=ty;
  } else {
   const dg=(dragNode===n&&dragging);
   n.px.t=n.ox+(dg?0:Math.sin(nowS*0.8+n.ph)*2); n.py.t=n.oy+(dg?0:Math.cos(nowS*0.7+n.ph)*2.5);
   n.hv.t=dg?0.03:0;
   if(dg){n.px.x=n.ox;n.py.x=n.oy;n.px.v=0;n.py.v=0;}
  }
  for(let i=0;i<sub;i++){stepSp(n.px,h);stepSp(n.py,h);stepSp(n.pw,h);stepSp(n.phh,h);stepSp(n.p,h);stepSp(n.sq,h);stepSp(n.hv,h);}
  const w=Math.max(n.pw.x,S*.2), hh=Math.max(n.phh.x,S*.2), q=clamp(n.p.x,0,1);
  const sc=1+n.sq.x+n.hv.x;
  n.el.style.transform=`translate3d(${(n.px.x-w/2).toFixed(1)}px,${(n.py.x-hh/2).toFixed(1)}px,0) scale(${sc.toFixed(3)})`;
  n.el.style.transformOrigin=`50% 50%`;
  if(Math.abs(w-n.wr)>.3||Math.abs(hh-n.hr)>.3){ n.wr=w;n.hr=hh; n.el.style.width=w.toFixed(1)+"px"; n.el.style.height=hh.toFixed(1)+"px"; }
  const rad=Math.min(Math.min(w,hh)/2,50*(1-q)+26*q); n.el.style.borderRadius=rad.toFixed(1)+"px";
  n.bub.style.opacity=clamp(1-q*3,0,1).toFixed(2); n.card.style.opacity=clamp((n.p.x-.25)*2,0,1).toFixed(2);
  n.card.style.pointerEvents=n.p.x>.6?"auto":"none";
  if(!n.open&&n.p.x<.03&&n.lastZ){n.el.style.zIndex=3;n.lastZ=0;}
  // thread
  const x2=n.px.x,y2=n.py.x,dx=x2,dy=y2,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  const bend=n.bend*len*(0.16+0.1*q)+Math.sin(nowS*0.9+n.ph)*(5+6*q);
  const cx=x2/2+nx*bend,cy=y2/2+ny*bend;
  n.path.setAttribute("d",`M0 0Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`);
  n.path.setAttribute("stroke-opacity",(0.28+0.62*q).toFixed(2)); n.path.setAttribute("stroke-width",(1.1+0.5*q).toFixed(2));
  if(q>0.2){const u=(nowS*0.35+n.ph*0.13)%1,v=1-u; n.pulse.setAttribute("cx",(v*v*0+2*v*u*cx+u*u*x2).toFixed(1)); n.pulse.setAttribute("cy",(2*v*u*cy+u*u*y2).toFixed(1)); n.pulse.setAttribute("opacity",(q*0.9).toFixed(2));}
  else n.pulse.setAttribute("opacity","0");
 });
 // camera
 const a=1-Math.exp(-dt*5.5);
 cam.x+=(camT.x-cam.x)*a; cam.y+=(camT.y-cam.y)*a; cam.z+=(camT.z-cam.z)*a;
 world.style.transform=`translate(${(W/2-cam.x*cam.z).toFixed(2)}px,${(H/2-cam.y*cam.z).toFixed(2)}px) scale(${cam.z.toFixed(4)})`;
 // eyes follow pointer
 let ex=0,ey=0; if(ptrW){const l=Math.hypot(ptrW.x,ptrW.y)||1,m=Math.min(1,l/300); ex=ptrW.x/l*4.5*m; ey=ptrW.y/l*3.5*m;}
 eyeX+=(ex-eyeX)*.12; eyeY+=(ey-eyeY)*.12; $("eyes").setAttribute("transform",`translate(${eyeX.toFixed(2)} ${eyeY.toFixed(2)})`);
}
function loop(ts){
 if(!running) return; requestAnimationFrame(loop);
 const dt=Math.min(((ts-last)/1000)||0.016,0.05); last=ts; nowS=ts/1000; step(dt);
}
function startLoop(){ if(running) return; running=true; last=performance.now(); requestAnimationFrame(loop); }
/* ---------- input ---------- */
const ptrs=new Map(); let gesture=null, moved=false, downT=null, downAt=0;
stage.addEventListener("pointerdown",e=>{
 if(e.target.closest&&e.target.closest("button")) return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
 if(ptrs.size===1){moved=false;downT=e.target;downAt=performance.now();dragNode=null;dragging=false;
  const n=nodeOf(e.target); if(n&&!n.open){n.sq.v=-6;}
  if(n&&n.open&&n.p.x>.6&&e.target.closest(".hd")&&!e.target.closest(".x")){ dragNode=n; n.el.style.zIndex=10+(++zc); n.lastZ=zc; } }
 else {moved=true; gesture=pinchState(); if(dragNode){dragNode.el.classList.remove("dragging");} dragNode=null;dragging=false;}
 const w=toWorld(e.clientX,e.clientY); if(e.pointerType!=="mouse") ptrW=w;
});
stage.addEventListener("pointermove",e=>{
 const w=toWorld(e.clientX,e.clientY); ptrW=w;
 const p=ptrs.get(e.pointerId); if(!p) return;
 const dx=e.clientX-p.x, dy=e.clientY-p.y;
 if(ptrs.size===1){
  if(!moved&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7){moved=true; try{stage.setPointerCapture(e.pointerId);}catch(_){}
   if(dragNode){dragging=true;dragNode.dragged=true;dragNode.el.classList.add("dragging");} else stage.classList.add("drag");}
  if(moved){ if(dragNode&&dragging){ dragNode.ox+=dx/cam.z; dragNode.oy+=dy/cam.z; }
   else if(!dragNode){manual=true; cam.x-=dx/cam.z; cam.y-=dy/cam.z; camT.x=cam.x; camT.y=cam.y;} }
  p.x=e.clientX;p.y=e.clientY;
 } else if(ptrs.size>=2){
  p.x=e.clientX;p.y=e.clientY; const g=pinchState();
  if(gesture&&gesture.d>0){ zoomAt(g.mx,g.my,g.d/gesture.d); cam.x-=(g.mx-gesture.mx)/cam.z; cam.y-=(g.my-gesture.my)/cam.z; camT.x=cam.x;camT.y=cam.y; }
  gesture=g;
 }
});
function pinchState(){const a=[...ptrs.values()]; if(a.length<2) return null; return {mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};}
function nodeOf(t){const f=t&&t.closest&&t.closest(".frame"); return f?NODES.find(n=>n.el===f):null;}
function endPtr(e,cancel){
 const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId);
 if(!had) return;
 if(ptrs.size===0){
  stage.classList.remove("drag"); gesture=null;
  if(dragNode){dragNode.el.classList.remove("dragging");} dragNode=null; dragging=false;
  if(!moved&&!cancel){
   const t=downT; const n=nodeOf(t);
   if(n){ if(!n.open||(t.closest(".hd"))) toggleNode(n); }
   else if(t&&t.closest&&t.closest("#chief")) chiefTap();
  }
  if(e.pointerType!=="mouse") ptrW=null;
 } else if(ptrs.size===1){ gesture=null; }
}
stage.addEventListener("pointerup",e=>endPtr(e,false));
stage.addEventListener("pointercancel",e=>endPtr(e,true));
stage.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse") ptrW=null; });
stage.addEventListener("wheel",e=>{
 const bd=e.target.closest&&e.target.closest(".bd.scroll"); if(bd&&!e.ctrlKey) return;
 e.preventDefault(); const f=Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0014)); zoomAt(e.clientX,e.clientY,f);
},{passive:false});
let chiefTm=[];
function chiefTap(){
 $("chief").animate([{transform:"scale(1)"},{transform:"scale(.9,1.1)"},{transform:"scale(1.1,.92)"},{transform:"scale(.97,1.03)"},{transform:"scale(1)"}],{duration:620,easing:"ease-out"});
 const m=$("mouth"); m.setAttribute("d","M36 38q12 14 24 0"); setTimeout(()=>m.setAttribute("d","M39 41q9 7 18 0"),900);
 chiefTm.forEach(clearTimeout); chiefTm=[];
 const anyOpen=NODES.some(n=>n.open);
 const list=anyOpen?NODES.filter(n=>n.open):NODES.slice();
 list.forEach((n,i)=>chiefTm.push(setTimeout(()=>{ if(anyOpen) closeNode(n); else openNode(n); },i*110)));
 chiefTm.push(setTimeout(refit,list.length*110+350));
}
$("zin").onclick=()=>zoomAt(W/2,H/2,1.3); $("zout").onclick=()=>zoomAt(W/2,H/2,1/1.3); $("fit").onclick=()=>refit();
document.addEventListener("keydown",e=>{ if($("gate").style.display!=="none") return; if(e.key==="+"||e.key==="=") zoomAt(W/2,H/2,1.2); else if(e.key==="-") zoomAt(W/2,H/2,1/1.2); else if(e.key==="0") refit(); });
addEventListener("resize",()=>{W=innerWidth;H=innerHeight; if(!manual) refit();});
(function(){const b=$("fsb"),de=document.documentElement,can=de.requestFullscreen||de.webkitRequestFullscreen; if(!can) return; b.style.display="flex";
 b.onclick=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document); else can.call(de); };})();
world.addEventListener("change",e=>{const c=e.target; if(!c||!c.matches||!c.matches("input[data-id]")) return; const o=tdLoad(); if(c.checked) o[c.dataset.id]=1; else delete o[c.dataset.id]; tdSave(o); renderAll();});
/* ambient bubbles + blink */
(function(){const a=$("amb"); for(let i=0;i<16;i++){const e=document.createElement("i"),s=14+Math.random()*58; e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${16+Math.random()*22}s;animation-delay:${-Math.random()*30}s;--dx:${(Math.random()-.5)*120}px`; a.appendChild(e);}
 (function bl(){ setTimeout(()=>{const c=$("chief"); c.classList.add("blink"); setTimeout(()=>c.classList.remove("blink"),200); bl();},2200+Math.random()*3200); })();})();
/* ---------- gate, decrypt, live, idle lock (same mechanics as the main dashboard) ---------- */
function dots(){const v=$("pw").value.length, n=Math.max(6,v); let h=""; for(let i=0;i<n;i++) h+=`<i class="${i<v?"f":""}"></i>`; $("dots").innerHTML=h;}
function setPw(v){$("pw").value=v; dots();}
function showApp(){$("gate").style.display="none";$("app").style.display="block";W=innerWidth;H=innerHeight; buildScene(); NODES.forEach(n=>{n.alive=false;n.el.style.opacity=0;n.px.x=n.py.x=0;n.px.v=n.py.v=0;n.pw.x=n.phh.x=S*.3;n.pw.t=n.phh.t=S;n.p.x=0;n.p.t=0;}); nowS=performance.now()/1000; NODES.forEach((n,i)=>{n.born=nowS+0.15+i*0.09;}); refit(); cam.x=camT.x;cam.y=camT.y;cam.z=camT.z*0.6; tick30(); startLoop();}
function showGate(msg){RAW=null;SNAP=null;LIVEAT=null;running=false;clearInterval(liveT);clearTimeout(idleT);
 NODES.forEach(n=>{ if(n.el){n.bd.innerHTML="";n.html="";n.open=false;n.dragged=false;n.memo=null;n.p.x=0;n.p.t=0;n.el.classList.remove("open","dragging");} });
 T={}; ptrs.clear(); dragNode=null; dragging=false; chiefTm.forEach(clearTimeout); chiefTm=[];
 $("app").style.display="none";$("gate").style.display="flex";setPw("");$("err").textContent=msg||"";}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 if(!(window.crypto&&crypto.subtle)) throw new Error("This browser cannot decrypt here (needs https or a local file).");
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.salt),iterations:BLOB.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.iv)},key,b64(BLOB.ct));
 return JSON.parse(new TextDecoder().decode(pt));
}
function bump(){ if(!RAW||PLAIN) return; clearTimeout(idleT); idleT=setTimeout(()=>showGate("Locked after 2 hours without use."),IDLE_MS); }
["pointerdown","keydown","touchstart","wheel"].forEach(e=>document.addEventListener(e,bump,{passive:true}));
$("f").onsubmit=async ev=>{
 ev.preventDefault(); const pw=$("pw").value; if(!pw) return;
 const btn=$("signin"), er=$("err"); btn.disabled=true; er.textContent="Checking\u2026";
 try{ SNAP=await unlock(pw.trim()); RAW=SNAP.tabs; setPw(""); er.textContent=""; showApp(); renderAll(); bump(); startLive(); }
 catch(e){ er.textContent=(e&&e.name==="OperationError")?"Wrong code - try again.":(e.message||"Could not unlock."); $("dots").classList.remove("shake"); void $("dots").offsetWidth; $("dots").classList.add("shake"); setPw(""); }
 btn.disabled=false;
};
$("pad").addEventListener("click",e=>{const k=e.target.closest("button")&&e.target.closest("button").dataset.k; if(k===undefined) return; const p=$("pw"); if(k==="del") setPw(p.value.slice(0,-1)); else if(k!=="") setPw(p.value+k);});
document.addEventListener("keydown",e=>{ if($("gate").style.display==="none") return; const p=$("pw"); if(/^\d$/.test(e.key)) setPw(p.value+e.key); else if(e.key==="Backspace") setPw(p.value.slice(0,-1)); });
let LIVEAT=null, liveT=null;
function badge(){ const el=$("live"); if(!SNAP){return;} if(LIVEAT){ const age=(Date.now()-LIVEAT.getTime())/6e4; el.className=age>12?"warn":"on"; $("livet").textContent=(age>12?"live paused \u00b7 ":"live \u00b7 ")+"updated "+LIVEAT.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); } else { el.className=""; $("livet").textContent="snapshot \u00b7 "+SNAP.generated; } }
async function pullLive(){ if(!SNAP||!SNAP.live||!RAW) return; try{ const r=await fetch(SNAP.live.url+"?k="+encodeURIComponent(SNAP.live.k),{cache:"no-store"}); const j=await r.json(); if(j&&j.ok&&j.tabs){ RAW=Object.assign({},SNAP.tabs,j.tabs); LIVEAT=new Date(); renderAll(); badge(); } }catch(e){} }
function startLive(){ LIVEAT=null; clearInterval(liveT); liveT=setInterval(pullLive,300000); pullLive(); badge(); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pullLive(); });
$("lock").onclick=()=>{ if(PLAIN) return; showGate("Locked."); };
setInterval(()=>{ if(RAW){ tick30(); renderAll(); } },30000);
dots();
if(PLAIN){ SNAP=PLAIN; RAW=SNAP.tabs; $("lock").style.display="none"; showApp(); renderAll(); window.__bubbles={NODES,openNode,closeNode,toggleNode,refit,cam,camT,zoomAt}; }
else { $("gate").style.display="flex"; }
</script>
